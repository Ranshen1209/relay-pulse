<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sakrylle Status — real-time availability, latency, and success-rate monitoring of the Sakrylle API service across GPT, DeepSeek, and Grok models." />
    <title>Sakrylle Status</title>

    <!-- 主题初始化脚本（必须同步执行，防止 FOUC 闪烁） -->
    <script>
      (function() {
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = isDark ? 'default-dark' : 'light-cool';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

        // 设置初始背景色和 loader 颜色（防止白屏）
        var bgColor = isDark ? '#020617' : '#f8fafc';
        var loaderColor = isDark ? '#b8a8e0' : '#9181bd';
        document.write('<style>body{background-color:' + bgColor + ';--loader-color:' + loaderColor + '}</style>');
      })();
    </script>

    <!-- Google Analytics -->
    <script>
      window.GA_MEASUREMENT_ID = '%VITE_GA_MEASUREMENT_ID%';
      // 只有当 VITE_GA_MEASUREMENT_ID 被设置为真实 ID 时才加载
      if (window.GA_MEASUREMENT_ID && window.GA_MEASUREMENT_ID.startsWith('G-')) {
        (function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_MEASUREMENT_ID;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', window.GA_MEASUREMENT_ID);
        })();
      }
    </script>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <!-- 初始加载状态：在 React 挂载前显示，避免白屏闪烁 -->
      <div id="initial-loader" style="
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      ">
        <!-- 三点跳动动画 -->
        <div class="dot" style="animation-delay: 0s;"></div>
        <div class="dot" style="animation-delay: 0.15s;"></div>
        <div class="dot" style="animation-delay: 0.3s;"></div>
        <style>
          .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--loader-color, #9181bd);
            animation: bounce 0.6s ease-in-out infinite alternate;
          }
          @keyframes bounce {
            from { transform: translateY(0); opacity: 0.4; }
            to { transform: translateY(-12px); opacity: 1; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
